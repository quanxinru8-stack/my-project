              disable: true
            - name: fromelf --bin !L -o .\BIN\Firmware_F411_V1.1.bin
              abortAfterFailed: true
              command: cd .\..\TEST405 - modify_logic-new\project && fromelf --bin ${KEIL_OUTPUT_DIR}\${ProjectName}.axf -o .\BIN\Firmware_F411_V1.1.bin
              disable: true
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: --diag_suppress=767,188,177
            C_FLAGS: --diag_suppress=767,188,177
            c99-mode: true
            one-elf-section-per-function: true
            optimization: level-0
            warnings: unspecified
          global:
            output-debug-info: enable
            use-microLIB: true
          linker:
            $outputTaskExcludes:
              - .bin
            output-format: elf
            ro-base: "0x08000000"
            rw-base: "0x20000000"
